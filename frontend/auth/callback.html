<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0d0d">
<title>ログイン処理中… - Signaly</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d0d0d;
    color: #e8e8e8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  main {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  p { font-size: 15px; opacity: .8; }
</style>
</head>
<body>
<main><p id="status">ログイン処理中です…</p></main>
<script src="../auth.js?v=3.0.0"></script>
<script>
(async () => {
  const back = (query) => window.location.replace('../' + (query || ''))

  try {
    // PKCE flow（?code=...）のときだけ明示的に交換する。
    // implicit flow（#access_token=...）は supabase-js の detectSessionInUrl が拾うため、
    // 下の getSession() で待ち受ければよい。
    const params = new URLSearchParams(window.location.search)
    if (params.get('error')) {
      back('?authError=denied')
      return
    }

    const code = params.get('code')
    if (code) {
      const { error } = await SignalyAuth.exchangeCodeForSession(code)
      if (error) {
        back('?authError=failed')
        return
      }
    }

    const session = await SignalyAuth.getSession()
    if (!session) {
      back('?authError=failed')
      return
    }

    // SSE 用の Cookie をここで貼っておくと、アプリ側は初回から通知を購読できる。
    // ログイン通知が飛ぶのもここだけ（トークン更新では飛ばさない）。
    await SignalyAuth.ensureSessionCookie('login')
    back()
  } catch {
    back('?authError=failed')
  }
})()
</script>
</body>
</html>
