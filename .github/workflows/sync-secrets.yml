name: Sync secrets

# 1Password→GitHubのシークレット同期を、issue-deckの画面のボタンから起こせるようにする
# （guchi-apps/issue-deck#1309・#1427）。
# **本体は issue-deck の reusable-sync-secrets.yml にあり、ここはトリガー定義だけの薄いcaller。**
#
# 書き込みはこのリポジトリのActionsの中で完結する（issue-deck側にSecrets書き込み権限を足さない）。
# 手元から直接叩く場合は scripts/sync-github-secrets.sh を個人アカウントのセッションで実行する
# （サービスアカウントでは書き込めない。guchi-apps/docs の knowledge/common-gotchas.md 参照）。
on:
  workflow_dispatch:
    inputs:
      only:
        description: "同期するKEYをカンマ区切りで絞る（空ならマニフェスト全件）"
        required: false
        type: string
        default: ""

concurrency:
  group: sync-secrets-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-secrets:
    uses: guchi-apps/issue-deck/.github/workflows/reusable-sync-secrets.yml@workflows/v25
    with:
      only: ${{ inputs.only }}
    permissions:
      contents: read
    secrets: inherit
