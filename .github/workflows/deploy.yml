name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-signaly-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump version.json before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  deploy:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      DB_ADMIN_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      DB_ADMIN_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      HOST: ${{ secrets.SERVER_HOST }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      ISSUE_DECK_URL: ${{ vars.APP_BASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SHARED_TOKEN_API_SECRET: ${{ secrets.SHARED_TOKEN_API_SECRET }}
      APP_URL: ${{ secrets.APP_URL }}
      DB_NAME: ${{ secrets.DB_NAME }}
      SIGNALY_LOGIN_WEBHOOK_URL: ${{ secrets.SIGNALY_LOGIN_WEBHOOK_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

    steps:
      - uses: actions/checkout@v4

      - name: SSH キーをセットアップ
        uses: shimataro/ssh-key-action@v2
        with:
          key:           ${{ env.SSH_PRIVATE_KEY }}
          known_hosts:   placeholder
          if_key_exists: replace

      - name: known_hosts を追加
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts

      # 配布物を作る。従来の rsync の除外（.git・.venv・.env・backend/channels.json）に加え、
      # 実行時に VPS 上で作られるもの（backend/vapid_private.pem・backend/data/）も入れない。
      # gate は配布物に入っていなかったファイルを消さないので、これらはデプロイをまたいで残る（#352）。
      - name: 配布物を作成
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/deploy.tar.gz"
          tar -czf "$archive" \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='backend/channels.json' \
            --exclude='backend/vapid_private.pem' \
            --exclude='backend/data' \
            --exclude='__pycache__' \
            backend frontend deploy scripts version.json channels.example.json
          # gate はシンボリックリンク・特殊ファイルを含む配布物を拒否する。先に分かる形で止める。
          if tar -tvzf "$archive" | grep -Ev '^[-d]' | grep -q .; then
            echo "::error::配布物に通常のファイル・ディレクトリ以外が含まれています"
            tar -tvzf "$archive" | grep -Ev '^[-d]'
            exit 1
          fi
          echo "DEPLOY_ARCHIVE=${archive}" >> "$GITHUB_ENV"

      # **VPS の app-deploy-gate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275・#305）へ渡す**（#352）。
      # 鍵はこのアプリ専用で、VPS の authorized_keys の command= が gate のアプリ名（signaly。置き場の
      # /home/github-user/apps/signaly に一致する）を固定する。任意のシェルコマンドは実行できず、
      # upload・env・deploy の3語だけが通る。旧配布物の削除・展開・.env の更新・稼働版の照合は gate、
      # VAPID 秘密鍵の書き出し・不要なキーの削除・venv・マイグレーション・user systemd の再起動・
      # ヘルスチェックは配布物の deploy/gate-install.sh が行う。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" upload < "${DEPLOY_ARCHIVE}"

      - name: Send environment variables
        env:
          # 稼働している版の照合に使う（#348）。gate が .env の APP_COMMIT_SHA と
          # 127.0.0.1:8002/api/app-version の sha の一致を最大60秒待ち、不一致ならデプロイを失敗にする
          # （guchi-apps/vps#298）。issue-deck の新方式リリースは、これを稼働確認の証拠として扱う。
          APP_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$APP_COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::APP_COMMIT_SHA が40桁のコミットSHAではありません: '${APP_COMMIT_SHA}'"
            exit 1
          fi
          # VAPID 秘密鍵は PEM（複数行）のため gate の env（1行1変数）では送れない。base64 の1行で送り、
          # deploy/gate-install.sh が backend/vapid_private.pem へ戻して .env からは消す（従来の
          # write_vapid_private_key と同じ結果）。
          VAPID_PRIVATE_KEY_B64="$(printf '%s' "$VAPID_PRIVATE_KEY" | base64 -w 0)"
          # マイグレーション専用ユーザー（DDL 権限あり）。.env へは書かず（gate が MIGRATE_DATABASE_URL を
          # .env へ書かない）、gate-install.sh が migrate_db.py の1コマンドの間だけ DB_ADMIN_USER /
          # DB_ADMIN_PASSWORD として渡す（#183）。未設定ならアプリ用ユーザーへフォールバックする（従来どおり）。
          urlenc() { URLENC_VALUE="$1" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["URLENC_VALUE"], safe=""))'; }
          MIGRATE_DATABASE_URL=""
          if [ -n "${DB_ADMIN_USER:-}" ]; then
            MIGRATE_DATABASE_URL="mysql://$(urlenc "$DB_ADMIN_USER"):$(urlenc "${DB_ADMIN_PASSWORD:-}")@${DB_HOST}:${DB_PORT}/$(urlenc "$DB_NAME")"
          fi
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY APP_URL ISSUE_DECK_URL SHARED_TOKEN_API_SECRET \
            SECRET_KEY SIGNALY_LOGIN_WEBHOOK_URL VAPID_PUBLIC_KEY VAPID_SUBJECT DB_NAME DB_USER DB_PASSWORD \
            DB_HOST DB_PORT MIGRATE_DATABASE_URL VAPID_PRIVATE_KEY_B64; do
            case "${!name}" in
              *$'\n'*|*$'\r'*) echo "::error::${name} が改行を含むため gate へ送れません"; exit 1 ;;
            esac
          done
          # 待受ポートはシークレットではなく設定値として平文で持つ（signaly.service.template の ExecStart と同じ 8002）。
          {
            printf '%s\n' "PORT=8002"
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
            printf '%s\n' "SUPABASE_URL=${SUPABASE_URL}"
            printf '%s\n' "SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}"
            printf '%s\n' "APP_URL=${APP_URL}"
            printf '%s\n' "ISSUE_DECK_URL=${ISSUE_DECK_URL}"
            printf '%s\n' "SHARED_TOKEN_API_SECRET=${SHARED_TOKEN_API_SECRET}"
            printf '%s\n' "SECRET_KEY=${SECRET_KEY}"
            printf '%s\n' "SIGNALY_LOGIN_WEBHOOK_URL=${SIGNALY_LOGIN_WEBHOOK_URL}"
            printf '%s\n' "VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}"
            printf '%s\n' "VAPID_PRIVATE_KEY_B64=${VAPID_PRIVATE_KEY_B64}"
            printf '%s\n' "VAPID_SUBJECT=${VAPID_SUBJECT}"
            printf '%s\n' "DB_NAME=${DB_NAME}"
            printf '%s\n' "DB_USER=${DB_USER}"
            printf '%s\n' "DB_PASSWORD=${DB_PASSWORD}"
            printf '%s\n' "DB_HOST=${DB_HOST}"
            printf '%s\n' "DB_PORT=${DB_PORT}"
            printf '%s\n' "MIGRATE_DATABASE_URL=${MIGRATE_DATABASE_URL}"
          } | ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" env

      - name: Deploy and restart
        run: ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" deploy

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  notify:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    if: always()

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP:    Signaly
          NOTIFY_KIND:   デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB:    deploy
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP:      Signaly
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_KIND:     リリース
          NOTIFY_STATUS:   ${{ needs.release.result }}
          NOTIFY_JOB:      release
          NOTIFY_VERSION:  ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
