name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-signaly-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump version.json before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  deploy:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      DB_ADMIN_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      DB_ADMIN_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      HOST: ${{ secrets.SERVER_HOST }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
      APP_URL: ${{ secrets.APP_URL }}
      DB_NAME: ${{ secrets.DB_NAME }}
      LOGIN_WEBHOOK_URL: ${{ secrets.LOGIN_WEBHOOK_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

    steps:
      - uses: actions/checkout@v4

      - name: SSH キーをセットアップ
        uses: shimataro/ssh-key-action@v2
        with:
          key:           ${{ env.SSH_PRIVATE_KEY }}
          known_hosts:   placeholder
          if_key_exists: replace

      - name: known_hosts を追加
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts

      - name: VPS にデプロイ
        env:
          TARGET_DIR:           ${{ env.TARGET_DIR }}
          DB_NAME:              ${{ env.DB_NAME }}
          DB_USER:              ${{ env.DB_USER }}
          DB_PASSWORD:          ${{ env.DB_PASSWORD }}
          DB_HOST:              ${{ env.DB_HOST }}
          DB_PORT:              ${{ env.DB_PORT }}
          # マイグレーション専用ユーザー（DDL権限あり）。アプリ用ユーザーは CRUD 権限しか
          # 持たず、テーブルを1つ足しただけで起動が CREATE command denied で落ちる（#183）。
          DB_ADMIN_USER:        ${{ env.DB_ADMIN_USER }}
          DB_ADMIN_PASSWORD:    ${{ env.DB_ADMIN_PASSWORD }}
          SUPABASE_URL:         ${{ env.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_PUBLISHABLE_KEY }}
          APP_URL:              ${{ env.APP_URL }}
          ALLOWED_EMAILS:       ${{ env.ALLOWED_EMAILS }}
          SECRET_KEY:           ${{ env.SECRET_KEY }}
          LOGIN_WEBHOOK_URL:    ${{ env.LOGIN_WEBHOOK_URL }}
          VAPID_PUBLIC_KEY:     ${{ env.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:    ${{ env.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:        ${{ env.VAPID_SUBJECT }}
        run: |
          rsync -az --delete \
            -e "ssh -p ${SSH_PORT}" \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='.env' \
            --exclude='backend/channels.json' \
            ./ "${USERNAME}@${HOST}:${TARGET_DIR}/"

          b64() { printf '%s' "$1" | base64 -w 0; }
          SUPABASE_URL_B64=$(b64 "$SUPABASE_URL")
          SUPABASE_PUBLISHABLE_KEY_B64=$(b64 "$SUPABASE_PUBLISHABLE_KEY")
          APP_URL_B64=$(b64 "$APP_URL")
          ALLOWED_EMAILS_B64=$(b64 "$ALLOWED_EMAILS")
          SECRET_KEY_B64=$(b64 "$SECRET_KEY")
          LOGIN_WEBHOOK_URL_B64=$(b64 "$LOGIN_WEBHOOK_URL")
          VAPID_PUBLIC_KEY_B64=$(b64 "$VAPID_PUBLIC_KEY")
          VAPID_PRIVATE_KEY_B64=$(b64 "$VAPID_PRIVATE_KEY")
          VAPID_SUBJECT_B64=$(b64 "$VAPID_SUBJECT")
          DB_NAME_B64=$(b64 "$DB_NAME")
          DB_USER_B64=$(b64 "$DB_USER")
          DB_PASSWORD_B64=$(b64 "$DB_PASSWORD")
          DB_HOST_B64=$(b64 "$DB_HOST")
          DB_PORT_B64=$(b64 "$DB_PORT")
          DB_ADMIN_USER_B64=$(b64 "$DB_ADMIN_USER")
          DB_ADMIN_PASSWORD_B64=$(b64 "$DB_ADMIN_PASSWORD")

          ssh -p "${SSH_PORT}" "${USERNAME}@${HOST}" << EOF
            set -e
            cd "${TARGET_DIR}"

            sync_env_var() {
              key="\$1"
              value="\$(printf '%s' "\$2" | base64 -d)"
              touch .env
              if grep -q "^\${key}=" .env; then
                grep -v "^\${key}=" .env > .env.tmp && mv .env.tmp .env
              fi
              printf '%s=%s\n' "\$key" "\$value" >> .env
            }

            remove_env_var() {
              key="\$1"
              touch .env
              if grep -q "^\${key}=" .env; then
                grep -v "^\${key}=" .env > .env.tmp && mv .env.tmp .env
              fi
            }

            write_vapid_private_key() {
              printf '%s' "\$1" | base64 -d > backend/vapid_private.pem
              chmod 600 backend/vapid_private.pem
              touch .env
              if grep -q '^VAPID_PRIVATE_KEY=' .env; then
                grep -v '^VAPID_PRIVATE_KEY=' .env > .env.tmp && mv .env.tmp .env
              fi
              if grep -q '^VAPID_PRIVATE_KEY_FILE=' .env; then
                grep -v '^VAPID_PRIVATE_KEY_FILE=' .env > .env.tmp && mv .env.tmp .env
              fi
              printf '%s=%s\n' 'VAPID_PRIVATE_KEY_FILE' 'vapid_private.pem' >> .env
            }

            sync_env_var SUPABASE_URL             '${SUPABASE_URL_B64}'
            sync_env_var SUPABASE_PUBLISHABLE_KEY '${SUPABASE_PUBLISHABLE_KEY_B64}'
            sync_env_var APP_URL              '${APP_URL_B64}'
            sync_env_var ALLOWED_EMAILS       '${ALLOWED_EMAILS_B64}'
            sync_env_var SECRET_KEY           '${SECRET_KEY_B64}'
            sync_env_var LOGIN_WEBHOOK_URL    '${LOGIN_WEBHOOK_URL_B64}'
            sync_env_var VAPID_PUBLIC_KEY     '${VAPID_PUBLIC_KEY_B64}'
            write_vapid_private_key           '${VAPID_PRIVATE_KEY_B64}'
            sync_env_var VAPID_SUBJECT        '${VAPID_SUBJECT_B64}'
            sync_env_var DB_NAME              '${DB_NAME_B64}'
            sync_env_var DB_USER              '${DB_USER_B64}'
            sync_env_var DB_PASSWORD          '${DB_PASSWORD_B64}'
            sync_env_var DB_HOST              '${DB_HOST_B64}'
            sync_env_var DB_PORT              '${DB_PORT_B64}'

            # Supabase Auth へ移行して使わなくなった値（guchi-apps/signaly#110）。
            # sync_env_var は書き込む鍵しか触らないため、明示的に消さないと
            # 本番の .env に旧 Google OAuth の資格情報が残り続ける。
            remove_env_var GOOGLE_CLIENT_ID
            remove_env_var GOOGLE_CLIENT_SECRET
            remove_env_var GOOGLE_REDIRECT_URI

            bash deploy/ensure_venv.sh "${TARGET_DIR}"

            # スキーマの反映はここだけで行う。DDL 権限はマイグレーション専用ユーザー
            # だけが持つため、この1コマンドの間だけ環境変数で渡す。**.env へは書かない**
            # ——書くと常時稼働する uvicorn まで DDL 権限を持つ（#183）。
            DB_ADMIN_USER="\$(printf '%s' '${DB_ADMIN_USER_B64}' | base64 -d)" \
            DB_ADMIN_PASSWORD="\$(printf '%s' '${DB_ADMIN_PASSWORD_B64}' | base64 -d)" \
            .venv/bin/python backend/migrate_db.py

            bash deploy/restart-service.sh "${TARGET_DIR}"

            bash deploy/health-check.sh
          EOF

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  notify:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    if: always()

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP:    Signaly
          NOTIFY_KIND:   デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
          NOTIFY_JOB:    deploy
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP:      Signaly
          NOTIFY_KIND:     リリース
          NOTIFY_STATUS:   ${{ needs.release.result }}
          NOTIFY_JOB:      release
          NOTIFY_VERSION:  ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
